# Offline OSM → SQLite for Pocket Medic
#
# Completely offline. No Overpass, Nominatim, or other network APIs.
# PBF parsing via osmiter (pip-installable on Windows + Ubuntu WSL).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osm-offline"
version = "2.0.0"
description = "Convert OSM PBF extracts into a survival-focused offline SQLite database"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "osmiter>=1.3.1",
  "protobuf>=4.21.0",
]

[project.scripts]
osm-offline = "osm_offline.cli:main"

[tool.setuptools.packages.find]
include = ["osm_offline*"]
