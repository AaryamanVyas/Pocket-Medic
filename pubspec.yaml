name: pocket_medic
description: Pocket Medic offline field assistant demo UI.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.8.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  flutter_gemma: ^1.4.1
  flutter_gemma_litertlm: ^1.3.1
  image_picker: ^1.0.7
  tflite_flutter: ^0.12.1
  image: ^3.0.2
  speech_to_text: ^7.4.0
  url_launcher: ^6.2.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mushroom_classifier.tflite
    - assets/labels.txt
    - assets/knowledge/knowledge_chunks.json
